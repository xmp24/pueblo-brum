name: assets
run-name: assets ${{ inputs.tag }}
on:
  workflow_dispatch:
    inputs:
      tag: {required: true}
permissions:
  contents: write
jobs:
  dl:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir -p out/kits out/hdri out/starter
          for k in car-kit city-kit-suburban city-kit-roads city-kit-commercial nature-kit toy-car-kit city-kit-industrial furniture-kit; do
            html=$(curl -sL -A "Mozilla/5.0" https://kenney.nl/assets/$k)
            u=$(echo "$html" | grep -oE '(https://kenney\.nl)?/[^"'"'"' ]*\.zip' | head -1)
            [ -n "$u" ] && [[ "$u" != http* ]] && u="https://kenney.nl$u"
            echo "$k -> $u"
            if [ -n "$u" ] && curl -sfL -A "Mozilla/5.0" -o /tmp/$k.zip "$u"; then
              mkdir -p /tmp/k/$k out/kits/$k && unzip -q -o /tmp/$k.zip -d /tmp/k/$k
              find /tmp/k/$k -iname "*.glb" -exec cp {} out/kits/$k/ \;
              find /tmp/k/$k -iname "*.png" -path "*Textures*" -exec cp {} out/kits/$k/ \; 2>/dev/null || true
              find /tmp/k/$k -iname "colormap*.png" -exec cp {} out/kits/$k/ \; 2>/dev/null || true
              cp /tmp/k/$k/License.txt out/kits/$k/ 2>/dev/null || true
              echo "  $(ls out/kits/$k | grep -ci glb) glb"
            else echo "FALLO $k"; echo "$html" | grep -oE '[^"]{0,60}\.zip[^"]{0,20}' | head -3; fi
          done
          for r in Starter-Kit-City-Builder Starter-Kit-Racing; do
            git clone -q --depth 1 https://github.com/KenneyNL/$r /tmp/$r && mkdir -p out/starter/$r && (cd /tmp/$r && find . -iname "*.glb" -o -iname "*.png" -path "*models*" | head -400 | while read f; do mkdir -p "$GITHUB_WORKSPACE/out/starter/$r/$(dirname "$f")"; cp "$f" "$GITHUB_WORKSPACE/out/starter/$r/$f"; done) && echo "OK $r $(find out/starter/$r -iname '*.glb' | wc -l) glb" || echo "FALLO $r"
          done
          du -sh out/*
      - run: |
          cd out && git init -q -b out && git add -A && git -c user.name=atlas -c user.email=atlas@users.noreply.github.com commit -qm assets
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" out:refs/heads/assets-${{ inputs.tag }}
